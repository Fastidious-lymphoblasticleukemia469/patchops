---
# Promote to /prod with bake-time validation.
# Only promotes snapshots that have existed for >48 hours in staging.

- name: Promote snapshot to prod (48hr bake gate)
  hosts: aptly
  become: true
  vars:
    aptly_config: /etc/aptly/aptly.conf
    aptly_user: aptly
    min_bake_hours: 48

  tasks:
    - name: List all available snapshots
      ansible.builtin.command:
        cmd: "aptly -config={{ aptly_config }} snapshot list -raw"
      become_user: "{{ aptly_user }}"
      register: snapshot_list
      changed_when: false

    - name: Find latest patchops snapshot
      ansible.builtin.set_fact:
        latest_snapshot: "{{ snapshot_list.stdout_lines | select('search', '^patchops-') | sort | last }}"

    - name: Extract snapshot epoch
      ansible.builtin.set_fact:
        snapshot_epoch: "{{ latest_snapshot | regex_search('(\\d{10})') }}"

    - name: Calculate snapshot age in hours
      ansible.builtin.set_fact:
        snapshot_age_hours: "{{ ((ansible_date_time.epoch | int - snapshot_epoch | int) / 3600) | round(1) }}"

    - name: Show promotion details
      ansible.builtin.debug:
        msg:
          - "Snapshot: {{ latest_snapshot }}"
          - "Snapshot age: {{ snapshot_age_hours }} hours"
          - "Required bake time: {{ min_bake_hours }} hours"

    - name: Fail if snapshot is too young
      ansible.builtin.fail:
        msg: >
          Snapshot {{ latest_snapshot }} is only {{ snapshot_age_hours }} hours old.
          Minimum bake time for prod is {{ min_bake_hours }} hours.
          Wait {{ (min_bake_hours - snapshot_age_hours) | round(1) }} more hours before promoting.
      when: snapshot_age_hours | float < min_bake_hours | float

    - name: Publish snapshot to prod
      ansible.builtin.command:
        cmd: >
          aptly -config={{ aptly_config }} publish switch
          -batch
          -prefix=prod
          -architectures=amd64
          -gpg-key="PatchOps Aptly"
          {{ latest_snapshot }}
          patchops-{{ snapshot_epoch }}
      become_user: "{{ aptly_user }}"
      register: publish
      changed_when: "'successfully updated' in publish.stdout or 'successfully published' in publish.stdout"
      failed_when: false

    - name: Initial publish to prod (if switch failed)
      ansible.builtin.command:
        cmd: >
          aptly -config={{ aptly_config }} publish snapshot
          -batch
          -prefix=prod
          -architectures=amd64
          -gpg-key="PatchOps Aptly"
          {{ latest_snapshot }}
      become_user: "{{ aptly_user }}"
      when: "'successfully updated' not in publish.stdout and 'successfully published' not in publish.stdout"
      register: publish_init
      changed_when: "'successfully published' in publish_init.stdout"
      failed_when: false

    - name: Verify prod route
      ansible.builtin.uri:
        url: "http://localhost:80/prod/dists/"
        return_content: yes
      register: verify
      failed_when: "'dists' not in verify.content"

    - name: Prod promotion complete
      ansible.builtin.debug:
        msg:
          - "Published {{ latest_snapshot }} to /prod/"
          - "Age: {{ snapshot_age_hours }}h (passed {{ min_bake_hours }}h gate)"
          - "URL: http://patchops-aptly:80/prod/dists/"

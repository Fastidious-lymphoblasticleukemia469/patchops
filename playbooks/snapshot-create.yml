---
# snapshot-create.yml — Daily mirror sync, snapshot creation, and dev promotion
#   1. Update all mirrors (sync with upstream)
#   2. Create timestamped snapshots per mirror
#   3. Merge into a single composite snapshot (patch-YYYYMMDD-HHMM)
#   4. Register snapshot in patchgov.snapshots table
#   5. Prune old snapshots (max 30 kept, published snapshots protected)
#   6. Publish the composite snapshot to /dev
#   7. Update dev_published_at in patchgov

- name: Daily snapshot creation and dev promotion
  hosts: aptly
  become: true
  vars:
    aptly_config: /etc/aptly/aptly.conf
    aptly_user: aptly
    govdb_host: localhost
    govdb_port: 5433
    govdb_name: patchgov
    govdb_user: postgres
    # govdb_password comes from group_vars/all/vars.yml (vault-backed) — do not hardcode here
    max_snapshots: 30
    ubuntu_repos:
      - name: ubuntu-noble
        mirror: http://archive.ubuntu.com/ubuntu/
        distribution: noble
        component: "main restricted universe multiverse"
      - name: ubuntu-noble-updates
        mirror: http://archive.ubuntu.com/ubuntu/
        distribution: noble-updates
        component: "main restricted universe multiverse"
      - name: ubuntu-noble-security
        mirror: http://security.ubuntu.com/ubuntu/
        distribution: noble-security
        component: "main restricted universe multiverse"
      - name: ubuntu-noble-backports
        mirror: http://archive.ubuntu.com/ubuntu/
        distribution: noble-backports
        component: "main restricted universe multiverse"
    third_party_repos:
      - name: docker
        mirror: https://download.docker.com/linux/ubuntu
        distribution: noble
        component: stable
      - name: nodesource-20
        mirror: https://deb.nodesource.com/node_20.x
        distribution: nodistro
        component: main
      - name: nginx-mainline
        mirror: http://nginx.org/packages/mainline/ubuntu
        distribution: noble
        component: nginx
    all_repos: "{{ ubuntu_repos + third_party_repos }}"

  tasks:
    # ── Generate readable snapshot name ─────────────────────────────
    - name: Generate snapshot name (patch-YYYYMMDD-HHMM)
      ansible.builtin.set_fact:
        snapshot_ts: "{{ ansible_date_time.date | replace('-', '') }}-{{ (ansible_date_time.hour + '00')[:2] }}{{ (ansible_date_time.minute + '00')[:2] }}"
        snapshot_name: "patch-{{ ansible_date_time.date | replace('-', '') }}-{{ (ansible_date_time.hour + '00')[:2] }}{{ (ansible_date_time.minute + '00')[:2] }}"

    # ── Sync mirrors ─────────────────────────────────────────────
    - name: Update all mirrors
      ansible.builtin.command:
        cmd: "aptly -config={{ aptly_config }} mirror update {{ item.name }}"
      become_user: "{{ aptly_user }}"
      loop: "{{ all_repos }}"
      register: mirror_update
      changed_when: "'Downloaded' in mirror_update.stdout or 'packages' in mirror_update.stdout"
      failed_when: mirror_update.rc != 0
      timeout: 5400

    # ── Create per-mirror snapshots ──────────────────────────────
    - name: Create snapshot for each mirror
      ansible.builtin.command:
        cmd: >
          aptly -config={{ aptly_config }} snapshot create
          {{ item.name }}-{{ snapshot_ts }}
          from mirror {{ item.name }}
      become_user: "{{ aptly_user }}"
      loop: "{{ all_repos }}"
      register: snapshot_create
      changed_when: "'Snapshot' in snapshot_create.stdout"
      failed_when: >
        snapshot_create.rc != 0 and
        'already exists' not in (snapshot_create.stderr | default(''))

    # ── Merge snapshots ──────────────────────────────────────────
    - name: Merge Ubuntu snapshots
      ansible.builtin.command:
        cmd: >
          aptly -config={{ aptly_config }} snapshot merge -latest
          noble-{{ snapshot_ts }}
          ubuntu-noble-{{ snapshot_ts }}
          ubuntu-noble-updates-{{ snapshot_ts }}
          ubuntu-noble-security-{{ snapshot_ts }}
          ubuntu-noble-backports-{{ snapshot_ts }}
      become_user: "{{ aptly_user }}"
      register: merge_ubuntu
      changed_when: "'Snapshot' in merge_ubuntu.stdout"
      failed_when: >
        merge_ubuntu.rc != 0 and
        'already exists' not in (merge_ubuntu.stderr | default(''))

    - name: Merge third-party snapshots
      ansible.builtin.command:
        cmd: >
          aptly -config={{ aptly_config }} snapshot merge -latest
          thirdparty-{{ snapshot_ts }}
          docker-{{ snapshot_ts }}
          nodesource-20-{{ snapshot_ts }}
          nginx-mainline-{{ snapshot_ts }}
      become_user: "{{ aptly_user }}"
      register: merge_tp
      changed_when: "'Snapshot' in merge_tp.stdout"
      failed_when: >
        merge_tp.rc != 0 and
        'already exists' not in (merge_tp.stderr | default(''))

    - name: Merge all into composite snapshot
      ansible.builtin.command:
        cmd: >
          aptly -config={{ aptly_config }} snapshot merge -latest
          {{ snapshot_name }}
          noble-{{ snapshot_ts }}
          thirdparty-{{ snapshot_ts }}
      become_user: "{{ aptly_user }}"
      register: merge_all
      changed_when: "'Snapshot' in merge_all.stdout"
      failed_when: >
        merge_all.rc != 0 and
        'already exists' not in (merge_all.stderr | default(''))

    # ── Register in patchgov.snapshots ────────────────────────────
    - name: Upsert snapshot into patchgov
      community.postgresql.postgresql_query:
        db: "{{ govdb_name }}"
        login_host: "{{ govdb_host }}"
        login_port: "{{ govdb_port }}"
        login_user: "{{ govdb_user }}"
        login_password: "{{ govdb_password }}"
        query: >
          INSERT INTO snapshots (name, created_at, mirror_sources)
          VALUES (
            '{{ snapshot_name }}',
            NOW(),
            ARRAY{{ all_repos | map(attribute='mirror') | list }}
          )
          ON CONFLICT (name) DO UPDATE SET
            created_at = snapshots.created_at,
            mirror_sources = snapshots.mirror_sources;
      delegate_to: localhost
      become: false
      register: db_upsert
      ignore_errors: true

    - name: Warn if DB tracking failed
      ansible.builtin.debug:
        msg: "WARNING: Could not register snapshot in patchgov. DB may be unavailable."
      when: db_upsert is failed

    # ── Prune old aptly snapshots (max {{ max_snapshots }} kept) ──
    - name: List all aptly snapshots
      ansible.builtin.command:
        cmd: "aptly -config={{ aptly_config }} snapshot list -raw"
      become_user: "{{ aptly_user }}"
      register: snapshot_list
      changed_when: false

    - name: Identify published snapshots (to protect from pruning)
      ansible.builtin.command:
        cmd: "aptly -config={{ aptly_config }} publish list -raw"
      become_user: "{{ aptly_user }}"
      register: published_list
      changed_when: false

    - name: Collect patch snapshots
      ansible.builtin.set_fact:
        patch_snapshots: "{{ snapshot_list.stdout_lines | select('search', '^patch-') | sort }}"

    - name: Prune excess patch snapshots (keep max {{ max_snapshots }})
      ansible.builtin.command:
        cmd: "aptly -config={{ aptly_config }} snapshot drop {{ item }}"
      become_user: "{{ aptly_user }}"
      loop: "{{ patch_snapshots }}"
      when:
        - patch_snapshots | length > max_snapshots
        - patch_snapshots.index(item) < (patch_snapshots | length - max_snapshots)
        - item not in published_list.stdout
      register: pruned
      changed_when: "'dropped' in pruned.stdout"
      failed_when: false

    - name: Warn about snapshots that failed to prune
      ansible.builtin.debug:
        msg: >
          WARNING: could not drop snapshot {{ item.item }}: {{ item.stderr | default('unknown error') }}
      loop: "{{ pruned.results | default([]) }}"
      when: item.rc is defined and item.rc != 0
      loop_control:
        label: "{{ item.item | default('') }}"

    # ── Publish to /dev ──────────────────────────────────────────
    - name: Publish snapshot to dev (switch)
      ansible.builtin.command:
        cmd: >
          aptly -config={{ aptly_config }} publish switch
          -batch
          -architectures=amd64
          -gpg-key="PatchOps Aptly"
          noble
          dev
          {{ snapshot_name }}
      become_user: "{{ aptly_user }}"
      register: publish_dev
      changed_when: "'successfully updated' in publish_dev.stdout or 'successfully published' in publish_dev.stdout"
      failed_when: false

    - name: Publish snapshot to dev (initial)
      ansible.builtin.command:
        cmd: >
          aptly -config={{ aptly_config }} publish snapshot
          -batch
          -architectures=amd64
          -gpg-key="PatchOps Aptly"
          -distribution=noble
          {{ snapshot_name }}
          dev
      become_user: "{{ aptly_user }}"
      when: "'successfully updated' not in publish_dev.stdout and 'successfully published' not in publish_dev.stdout"
      register: publish_dev_init
      changed_when: "'successfully published' in publish_dev_init.stdout"
      failed_when: false

    - name: Fail if dev publish did not actually succeed
      ansible.builtin.fail:
        msg: >
          Failed to publish {{ snapshot_name }} to /dev/.
          switch: rc={{ publish_dev.rc }} {{ publish_dev.stderr | default('') }}
          initial: rc={{ publish_dev_init.rc | default('skipped') }} {{ publish_dev_init.stderr | default('') }}
      when: >
        publish_dev.rc != 0 and
        (publish_dev_init is skipped or publish_dev_init.rc != 0)

    # ── Update dev_published_at in patchgov ───────────────────────
    - name: Update dev_published_at in patchgov
      community.postgresql.postgresql_query:
        db: "{{ govdb_name }}"
        login_host: "{{ govdb_host }}"
        login_port: "{{ govdb_port }}"
        login_user: "{{ govdb_user }}"
        login_password: "{{ govdb_password }}"
        query: >
          UPDATE snapshots
          SET dev_published_at = NOW()
          WHERE name = '{{ snapshot_name }}'
            AND dev_published_at IS NULL;
      delegate_to: localhost
      become: false
      register: db_dev_update
      ignore_errors: true

    # ── Verify dev route ─────────────────────────────────────────
    - name: Verify dev route is accessible
      ansible.builtin.uri:
        url: "http://localhost:80/dev/dists/"
        return_content: true
      register: verify
      failed_when: "'dists' not in verify.content"

    # ── Output ───────────────────────────────────────────────────
    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Snapshot: {{ snapshot_name }}"
          - "Published to: /dev/"
          - "URL: http://{{ inventory_hostname }}:80/dev/dists/"
          - "DB tracked: {{ 'yes' if db_upsert is not failed else 'no' }}"

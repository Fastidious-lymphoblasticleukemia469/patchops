---
# snapshot-list.yml — Show all aptly state + patchgov snapshot tracking

- name: Show aptly state and patchgov snapshot timeline
  hosts: aptly
  become: true
  vars:
    aptly_config: /etc/aptly/aptly.conf
    aptly_user: aptly
    govdb_host: "{{ hostvars['patchops-govdb']['ansible_host'] | default('patchops-govdb') }}"
    govdb_port: 5433
    govdb_name: patchgov
    govdb_user: postgres
    # govdb_password comes from group_vars/all/vars.yml (vault-backed) — do not hardcode here

  tasks:
    # ── Aptly state ───────────────────────────────────────────────
    - name: List mirrors
      ansible.builtin.command:
        cmd: "aptly -config={{ aptly_config }} mirror list -raw"
      become_user: "{{ aptly_user }}"
      register: mirrors
      changed_when: false

    - name: Show mirrors
      ansible.builtin.debug:
        msg:
          - "=== Mirrors ==="
          - "{{ mirrors.stdout_lines if mirrors.stdout_lines else ['(none)'] }}"

    - name: List snapshots
      ansible.builtin.command:
        cmd: "aptly -config={{ aptly_config }} snapshot list -raw"
      become_user: "{{ aptly_user }}"
      register: snapshots
      changed_when: false

    - name: Show snapshots
      ansible.builtin.debug:
        msg:
          - "=== Snapshots ==="
          - "{{ snapshots.stdout_lines if snapshots.stdout_lines else ['(none)'] }}"

    - name: List published repos
      ansible.builtin.command:
        cmd: "aptly -config={{ aptly_config }} publish list"
      become_user: "{{ aptly_user }}"
      register: published
      changed_when: false

    - name: Show published repos
      ansible.builtin.debug:
        msg:
          - "=== Published Repos ==="
          - "{{ published.stdout_lines if published.stdout_lines else ['(none)'] }}"

    # ── Patchgov snapshot timeline ────────────────────────────────
    - name: Query patchgov snapshot timeline
      community.postgresql.postgresql_query:
        db: "{{ govdb_name }}"
        login_host: "{{ govdb_host }}"
        login_port: "{{ govdb_port }}"
        login_user: "{{ govdb_user }}"
        login_password: "{{ govdb_password }}"
        query: >
          SELECT
            name,
            created_at,
            dev_published_at,
            staging_published_at,
            prod_published_at
          FROM snapshots
          ORDER BY created_at DESC
          LIMIT 20;
      register: govdb_snapshots
      ignore_errors: true

    - name: Show patchgov snapshot timeline
      ansible.builtin.debug:
        msg:
          - "=== PatchGov Snapshot Timeline (last 20) ==="
          - "{{ govdb_snapshots.query_result if govdb_snapshots.query_result is defined and govdb_snapshots is not failed else '(DB unavailable)' }}"
      when: govdb_snapshots is not failed

    - name: Warn if patchgov unavailable
      ansible.builtin.debug:
        msg: "=== PatchGov: UNAVAILABLE ==="
      when: govdb_snapshots is failed

    # ── Test environment routes ───────────────────────────────────
    - name: Test environment routes
      ansible.builtin.uri:
        url: "http://localhost:80/{{ item }}/dists/"
        return_content: true
        status_code: [200, 301, 302, 403]
      register: route_check
      loop: [dev, staging, prod]
      failed_when: false

    - name: Show route status
      ansible.builtin.debug:
        msg: "Route /{{ item.item }}/: {{ item.status | default('error') }}"
      loop: "{{ route_check.results }}"

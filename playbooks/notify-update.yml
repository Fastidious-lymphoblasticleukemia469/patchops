---
# notify-update.yml — Send email notification after host update
# Queries govdb for patch history and sends a summary via SMTP.
# Usage: ansible-playbook playbooks/notify-update.yml

- name: Send update completion notification
  hosts: localhost
  gather_facts: false
  vars:
    smtp_host: localhost
    smtp_port: 2525
    smtp_from: patchops@localhost
    smtp_to: patchops@localhost
    update_hostname: "{{ lookup('env', 'UPDATE_HOSTNAME') | default('unknown', true) }}"
    update_env: "{{ lookup('env', 'UPDATE_ENV') | default('unknown', true) }}"
    update_status: "{{ lookup('env', 'UPDATE_STATUS') | default('unknown', true) }}"
    update_packages: "{{ lookup('env', 'UPDATE_PACKAGES') | default('0', true) }}"
    update_reboot: "{{ lookup('env', 'UPDATE_REBOOT') | default('false', true) }}"
    update_snapshot: "{{ lookup('env', 'UPDATE_SNAPSHOT') | default('none', true) }}"
    update_timestamp: "{{ lookup('env', 'UPDATE_TIMESTAMP') | default(ansible_date_time.iso8601 | default('now', true), true) }}"

  tasks:
    - name: Query latest patch from govdb
      community.postgresql.postgresql_query:
        db: patchgov
        login_host: localhost
        login_port: 5433
        login_user: postgres
        login_password: patchops_govdb_pass
        query: |
          SELECT hostname, env_name, patch_timestamp, patch_type, status,
                 packages_changed, reboot_done, snapshot_used
          FROM patch_history
          WHERE hostname = %s
          ORDER BY patch_timestamp DESC
          LIMIT 1
        positional_args:
          - "{{ update_hostname }}"
      register: patch_query
      when: update_hostname != 'unknown'

    - name: Set update facts from DB
      ansible.builtin.set_fact:
        db_status: "{{ patch_query.query_result[0].status if patch_query.query_result | length > 0 else 'unknown' }}"
        db_reboot_done: "{{ patch_query.query_result[0].reboot_done if patch_query.query_result | length > 0 else 'unknown' }}"
        db_packages: "{{ patch_query.query_result[0].packages_changed if patch_query.query_result | length > 0 else 'unknown' }}"
        db_snapshot: "{{ patch_query.query_result[0].snapshot_used if patch_query.query_result | length > 0 else 'unknown' }}"
      when: update_hostname != 'unknown'

    - name: Build email body
      ansible.builtin.set_fact:
        email_body: |
          PatchOps Update Complete
          =======================

          Host:        {{ update_hostname }}
          Environment: {{ update_env }}
          Timestamp:   {{ update_timestamp }}

          Status:      {{ db_status | default(update_status, true) }}
          Packages:    {{ db_packages | default(update_packages, true) }}
          Snapshot:    {{ db_snapshot | default(update_snapshot, true) }}
          Reboot Done: {{ db_reboot_done | default(update_reboot, true) }}

          --
          PatchOps Automated Notification

    - name: Send email notification
      community.general.mail:
        host: "{{ smtp_host }}"
        port: "{{ smtp_port }}"
        from: "{{ smtp_from }}"
        to: "{{ smtp_to }}"
        subject: "[PatchOps] Update Complete: {{ update_hostname }} ({{ update_env }})"
        body: "{{ email_body }}"
      register: mail_result
      ignore_errors: true

    - name: Report notification status
      ansible.builtin.debug:
        msg: >
          {{ 'Email sent successfully' if mail_result is succeeded else
             'Email failed: ' + (mail_result.msg | default('unknown error')) }}

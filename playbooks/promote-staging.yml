---
# promote-staging.yml — Promote to /staging with 24hr bake gate
# Checks patchgov.snapshots.dev_published_at to enforce soak time.

- name: Promote snapshot to staging (24hr bake gate)
  hosts: aptly
  become: true
  vars:
    aptly_config: /etc/aptly/aptly.conf
    aptly_user: aptly
    min_bake_hours: 24
    govdb_host: "{{ hostvars['patchops-govdb']['ansible_host'] | default('patchops-govdb') }}"
    govdb_port: 5433
    govdb_name: patchgov
    govdb_user: postgres
    govdb_password: patchops_govdb_pass

  tasks:
    # ── Find latest snapshot from patchgov ────────────────────────
    - name: Query latest snapshot from patchgov
      community.postgresql.postgresql_query:
        db: "{{ govdb_name }}"
        login_host: "{{ govdb_host }}"
        login_port: "{{ govdb_port }}"
        login_user: "{{ govdb_user }}"
        login_password: "{{ govdb_password }}"
        query: >
          SELECT name, dev_published_at
          FROM snapshots
          WHERE dev_published_at IS NOT NULL
            AND staging_published_at IS NULL
          ORDER BY created_at DESC
          LIMIT 1;
      register: latest_snapshot
      ignore_errors: true

    - name: Fail if no snapshot available for promotion
      ansible.builtin.fail:
        msg: "No snapshot found in patchgov with dev_published_at set and staging_published_at NULL."
      when: latest_snapshot is failed or latest_snapshot.query_result | length == 0

    - name: Extract snapshot name
      ansible.builtin.set_fact:
        snapshot_name: "{{ latest_snapshot.query_result[0].name }}"
        dev_published_at: "{{ latest_snapshot.query_result[0].dev_published_at }}"

    # ── Calculate soak time ──────────────────────────────────────
    - name: Calculate hours since dev publication
      community.postgresql.postgresql_query:
        db: "{{ govdb_name }}"
        login_host: "{{ govdb_host }}"
        login_port: "{{ govdb_port }}"
        login_user: "{{ govdb_user }}"
        login_password: "{{ govdb_password }}"
        query: >
          SELECT EXTRACT(EPOCH FROM (NOW() - dev_published_at)) / 3600.0 AS hours_soaked
          FROM snapshots
          WHERE name = '{{ snapshot_name }}';
      register: soak_check

    - name: Set soak hours fact
      ansible.builtin.set_fact:
        soak_hours: "{{ '%.1f' | format(soak_check.query_result[0].hours_soaked | float) }}"

    - name: Show promotion details
      ansible.builtin.debug:
        msg:
          - "Snapshot: {{ snapshot_name }}"
          - "Soaked in dev: {{ soak_hours }} hours"
          - "Required: {{ min_bake_hours }} hours"

    - name: Fail if snapshot hasn't soaked long enough
      ansible.builtin.fail:
        msg: >
          Snapshot {{ snapshot_name }} has only soaked for {{ soak_hours }} hours in dev.
          Minimum required: {{ min_bake_hours }} hours.
          Wait {{ '%.1f' | format(min_bake_hours | float - soak_hours | float) }} more hours.
      when: soak_hours | float < min_bake_hours | float

    # ── Promote to /staging ──────────────────────────────────────
    - name: Publish snapshot to staging (switch)
      ansible.builtin.command:
        cmd: >
          aptly -config={{ aptly_config }} publish switch
          -batch
          -architectures=amd64
          -gpg-key="PatchOps Aptly"
          noble
          staging
          {{ snapshot_name }}
      become_user: "{{ aptly_user }}"
      register: publish
      changed_when: "'successfully updated' in publish.stdout or 'successfully published' in publish.stdout"
      failed_when: false

    - name: Publish snapshot to staging (initial)
      ansible.builtin.command:
        cmd: >
          aptly -config={{ aptly_config }} publish snapshot
          -batch
          -architectures=amd64
          -gpg-key="PatchOps Aptly"
          -distribution=noble
          {{ snapshot_name }}
          staging
      become_user: "{{ aptly_user }}"
      when: "'successfully updated' not in publish.stdout and 'successfully published' not in publish.stdout"
      register: publish_init
      changed_when: "'successfully published' in publish_init.stdout"
      failed_when: false

    # ── Update staging_published_at ───────────────────────────────
    - name: Update staging_published_at in patchgov
      community.postgresql.postgresql_query:
        db: "{{ govdb_name }}"
        login_host: "{{ govdb_host }}"
        login_port: "{{ govdb_port }}"
        login_user: "{{ govdb_user }}"
        login_password: "{{ govdb_password }}"
        query: >
          UPDATE snapshots
          SET staging_published_at = NOW()
          WHERE name = '{{ snapshot_name }}'
            AND staging_published_at IS NULL;
      ignore_errors: true

    # ── Verify staging route ─────────────────────────────────────
    - name: Verify staging route
      ansible.builtin.uri:
        url: "http://localhost:80/staging/dists/"
        return_content: true
      register: verify
      failed_when: "'dists' not in verify.content"

    - name: Staging promotion complete
      ansible.builtin.debug:
        msg:
          - "Published {{ snapshot_name }} to /staging/"
          - "Soaked {{ soak_hours }}h in dev (passed {{ min_bake_hours }}h gate)"
          - "URL: http://patchops-aptly:80/staging/dists/"

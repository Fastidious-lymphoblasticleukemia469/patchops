services:
  aptly:
    build:
      context: .
      dockerfile: aptly.Dockerfile
    image: patchops-aptly:latest
    container_name: patchops-aptly
    hostname: patchops-aptly
    ports:
      - "80:80"
      - "8080:8080"
      - "2200:22"
    volumes:
      - aptly-data:/var/cache/aptly
      - aptly-gnupg:/home/aptly/.gnupg
      - ${HOME}/.ssh/personal.pub:/tmp/ssh_key.pub:ro
    networks:
      - ansible-lab-net

  ubuntu1:
    build:
      context: .
      dockerfile: Dockerfile
    image: ansible-ubuntu:24.04
    container_name: ansible-ubuntu1
    hostname: ansible-ubuntu1
    ports:
      - "2201:22"
    volumes:
      - ubuntu1-home:/home/ansible
      - ubuntu1-data:/data
      - ${HOME}/.ssh/personal.pub:/tmp/ssh_key.pub:ro
    networks:
      - ansible-lab-net

  ubuntu2:
    image: ansible-ubuntu:24.04
    container_name: ansible-ubuntu2
    hostname: ansible-ubuntu2
    ports:
      - "2202:22"
    volumes:
      - ubuntu2-home:/home/ansible
      - ubuntu2-data:/data
      - ${HOME}/.ssh/personal.pub:/tmp/ssh_key.pub:ro
    networks:
      - ansible-lab-net

  ubuntu3:
    image: ansible-ubuntu:24.04
    container_name: ansible-ubuntu3
    hostname: ansible-ubuntu3
    ports:
      - "2203:22"
    volumes:
      - ubuntu3-home:/home/ansible
      - ubuntu3-data:/data
      - ${HOME}/.ssh/personal.pub:/tmp/ssh_key.pub:ro
    networks:
      - ansible-lab-net

  ubuntu4:
    image: ansible-ubuntu:24.04
    container_name: ansible-ubuntu4
    hostname: ansible-ubuntu4
    ports:
      - "2204:22"
    volumes:
      - ubuntu4-home:/home/ansible
      - ubuntu4-data:/data
      - ${HOME}/.ssh/personal.pub:/tmp/ssh_key.pub:ro
    networks:
      - ansible-lab-net

  ubuntu5:
    image: ansible-ubuntu:24.04
    container_name: ansible-ubuntu5
    hostname: ansible-ubuntu5
    ports:
      - "2205:22"
    volumes:
      - ubuntu5-home:/home/ansible
      - ubuntu5-data:/data
      - ${HOME}/.ssh/personal.pub:/tmp/ssh_key.pub:ro
    networks:
      - ansible-lab-net

  govdb:
    image: postgres:16-alpine
    container_name: patchops-govdb
    hostname: patchops-govdb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: patchgov
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${GOVDB_PASSWORD:-patchops_govdb_pass}
    volumes:
      - govdb-data:/var/lib/postgresql/data
    networks:
      - ansible-lab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patchgov"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.0
    container_name: patchops-grafana
    hostname: patchops-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: patchops
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/patch-ops.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - ansible-lab-net
    depends_on:
      govdb:
        condition: service_healthy

volumes:
  aptly-data:
  aptly-gnupg:
  govdb-data:
  grafana-data:
  ubuntu1-home:
  ubuntu1-data:
  ubuntu2-home:
  ubuntu2-data:
  ubuntu3-home:
  ubuntu3-data:
  ubuntu4-home:
  ubuntu4-data:
  ubuntu5-home:
  ubuntu5-data:

networks:
  ansible-lab-net:
    driver: bridge

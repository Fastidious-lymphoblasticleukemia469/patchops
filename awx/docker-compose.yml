# AWX Docker Compose - Standalone Configuration for patchops
# Based on the infra-engine amogaio/awx-standalone pattern
# (/home/ssk/Work/amoga/infra-engine/awx/), adapted for a single-machine,
# non-K8s deployment.
#
# Key points:
# - Receptor configured for single-node standalone mode (no mesh needed)
# - EE job containers run with --network host (see ../awx/settings.py) so
#   they can reach patchops' localhost:<port>-mapped lab fleet exactly like
#   a developer running ansible-playbook directly from this host would.
# - This is AWX's OWN postgres/redis — separate from patchops' own
#   patchgov database (../compose.yml).
# - Explicit project name + prefixed resource names below: infra-engine's own
#   awx/ stack (a separate repo on the same machine) uses the same directory
#   name "awx", which would otherwise collide on container/volume/network
#   names when both are run on one Docker host.

name: patchops-awx

x-awx-env: &awx-env
  SECRET_KEY: ${AWX_SECRET_KEY}
  DATABASE_HOST: postgres
  DATABASE_NAME: awx
  DATABASE_USER: awx
  DATABASE_PASSWORD: ${AWX_DB_PASSWORD:-awxpass}
  DATABASE_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  AWX_ADMIN_USER: ${AWX_ADMIN_USER:-admin}
  AWX_ADMIN_PASSWORD: ${AWX_ADMIN_PASSWORD}
  AWX_ADMIN_EMAIL: ${AWX_ADMIN_EMAIL:-admin@example.com}
  AWX_VAULT_PASSWORD: ${AWX_VAULT_PASSWORD}
  # Required for standalone - prevents K8s mode errors
  AWX_ISOLATION_SHARED_PATH: /var/lib/awx

x-awx-volumes: &awx-volumes
  - awx_projects:/var/lib/awx/projects
  - ..:/var/lib/awx/projects/patchops:ro
  - ${SSH_KEY_PATH}:/var/lib/awx/patchops-ssh-key:ro
  - ./settings.py:/etc/tower/settings.py:ro
  - ./nginx.conf:/etc/nginx/nginx.conf:ro
  - awx_receptor:/var/run/receptor
  - ./launch_web.sh:/usr/bin/launch_web.sh

x-task-volumes: &task-volumes
  - awx_projects:/var/lib/awx/projects
  - ..:/var/lib/awx/projects/patchops:ro
  - ./settings.py:/etc/tower/settings.py:ro
  - ./nginx.conf:/etc/nginx/nginx.conf:ro
  - awx_receptor:/var/run/receptor
  - /var/run/docker.sock:/var/run/docker.sock
  - ./launch_task.sh:/usr/bin/launch_task.sh
  - ./receptor.conf:/etc/receptor/receptor.conf:ro
  # Shared runner scratch space: awx-task writes job files here; host Docker daemon
  # mounts the same path into EE containers — both sides must see the same directory.
  - /tmp/awx-runner:/tmp/awx-runner

x-logging: &logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:
  postgres:
    image: postgres:17
    container_name: patchops-awx-postgres
    environment:
      POSTGRES_USER: awx
      POSTGRES_PASSWORD: ${AWX_DB_PASSWORD:-awxpass}
      POSTGRES_DB: awx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awx"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: patchops-awx-redis
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 64M

  awx_web:
    image: 2ssk/awx-standalone:${AWX_VERSION:-latest}
    container_name: patchops-awx-web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    hostname: awxweb
    ports:
      - "${AWX_PORT:-8080}:8052"
    environment:
      <<: *awx-env
    volumes: *awx-volumes
    # Custom bootstrap script: runs migrations + creates admin user, then calls launch_awx_web.sh
    command: /usr/bin/launch_web.sh
    user: root
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:8052/api/v2/ping/ -o /dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1.5G
        reservations:
          memory: 512M

  awx_task:
    image: 2ssk/awx-standalone:${AWX_VERSION:-latest}
    container_name: patchops-awx-task
    depends_on:
      awx_web:
        condition: service_healthy
    hostname: awx
    environment:
      <<: *awx-env
    volumes: *task-volumes
    command: /usr/bin/launch_task.sh
    user: root
    privileged: true
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "supervisorctl -c /etc/supervisord_task.conf status | grep -c RUNNING || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 3G
        reservations:
          memory: 1G

networks:
  default:
    name: patchops_awx_network
    driver: bridge

volumes:
  postgres_data:
    name: patchops_awx_postgres_data
  awx_projects:
    name: patchops_awx_projects
  awx_receptor:
    name: patchops_awx_receptor

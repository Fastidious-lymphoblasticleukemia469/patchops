---
# Receptor configuration for single-node standalone AWX
# This enables the dispatcher to work without Kubernetes
#
# The receptor config defines the mesh networking between AWX components.
# For standalone (single-node), we create a minimal config.

- node:
    id: awx

# Local-only mode - no peer connections needed for standalone
- local-only:
    local: true

# Control service - required for dispatcher communication
- control-service:
    service: control
    filename: /var/run/receptor/receptor.sock

# Work command - ansible-runner lives in the AWX virtualenv, not on $PATH
- work-command:
    worktype: local
    command: /var/lib/awx/venv/awx/bin/ansible-runner
    params: worker
    allowruntimeparams: true

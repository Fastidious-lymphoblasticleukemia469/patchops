---
# setup_govdb — One-time provisioning of the patchgov PostgreSQL governance database
# Creates 4 tables, 1 view, 9 indexes, read-only user, and performs retention cleanup.
# Fully idempotent — safe to re-run.

- name: Check PostgreSQL connectivity
  community.postgresql.postgresql_ping:
    db: "{{ patch_governance_db_name }}"
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
  register: pg_ping
  ignore_errors: true

- name: Fail if PostgreSQL is unreachable
  ansible.builtin.fail:
    msg: >
      Cannot connect to PostgreSQL at {{ patch_governance_db_host }}:{{ patch_governance_db_port }}.
      Ensure the govdb container is running and healthy.
  when: pg_ping is failed

# ── Step 1: Connection pool tuning ─────────────────────────────────
# Note: ALTER SYSTEM SET max_connections = {{ patch_governance_db_max_connections }};
# requires a PostgreSQL restart and cannot run in a transaction block.
# For lab environments, the default 100 connections is sufficient.
# For production, run manually: ALTER SYSTEM SET max_connections = 200;
- name: Log connection pool info
  ansible.builtin.debug:
    msg: "Current max_connections: 100 (lab default). Production override: ALTER SYSTEM SET max_connections = 200;"

# ── Step 2: Create database ────────────────────────────────────────
- name: Create patchgov database
  community.postgresql.postgresql_db:
    name: "{{ patch_governance_db_name }}"
    state: present
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"

# ── Step 3: Create scan_results table ──────────────────────────────
- name: Create scan_results table
  community.postgresql.postgresql_query:
    db: "{{ patch_governance_db_name }}"
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    query: |
      CREATE TABLE IF NOT EXISTS scan_results (
        id SERIAL PRIMARY KEY,
        hostname TEXT NOT NULL,
        env_name TEXT NOT NULL,
        scan_timestamp TIMESTAMPTZ NOT NULL,
        risk_tier TEXT,
        risk_score INTEGER,
        cve_count INTEGER,
        max_cvss REAL,
        security_count INTEGER,
        regular_count INTEGER,
        total_upgrades INTEGER,
        reboot_required BOOLEAN,
        reboot_pending_days INTEGER,
        internet_exposed BOOLEAN,
        business_criticality TEXT,
        snapshot_used TEXT,
        awx_job_id TEXT,
        raw_result JSONB
      );

      CREATE INDEX IF NOT EXISTS idx_scan_hostname
        ON scan_results (hostname, scan_timestamp DESC);
      CREATE INDEX IF NOT EXISTS idx_scan_env
        ON scan_results (env_name, scan_timestamp DESC);
      CREATE INDEX IF NOT EXISTS idx_scan_risk
        ON scan_results (risk_tier, scan_timestamp DESC);

# ── Step 4: Create scan_package_details table ──────────────────────
- name: Create scan_package_details table
  community.postgresql.postgresql_query:
    db: "{{ patch_governance_db_name }}"
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    query: |
      CREATE TABLE IF NOT EXISTS scan_package_details (
        id SERIAL PRIMARY KEY,
        scan_id INTEGER NOT NULL REFERENCES scan_results(id) ON DELETE CASCADE,
        hostname TEXT NOT NULL,
        env_name TEXT NOT NULL,
        scan_timestamp TIMESTAMPTZ NOT NULL,
        package_name TEXT NOT NULL,
        source_package TEXT,
        current_version TEXT,
        new_version TEXT,
        is_security BOOLEAN DEFAULT false,
        tier TEXT,
        tier_label TEXT,
        cve_id TEXT,
        cve_priority TEXT,
        cvss_score REAL
      );

      CREATE INDEX IF NOT EXISTS idx_pkgdetail_scan
        ON scan_package_details (scan_id);
      CREATE INDEX IF NOT EXISTS idx_pkgdetail_hostname
        ON scan_package_details (hostname, scan_timestamp DESC);
      CREATE INDEX IF NOT EXISTS idx_pkgdetail_env
        ON scan_package_details (env_name, scan_timestamp DESC);
      CREATE INDEX IF NOT EXISTS idx_pkgdetail_package
        ON scan_package_details (package_name);

# ── Step 5: Create patch_history table ─────────────────────────────
- name: Create patch_history table
  community.postgresql.postgresql_query:
    db: "{{ patch_governance_db_name }}"
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    query: |
      CREATE TABLE IF NOT EXISTS patch_history (
        id SERIAL PRIMARY KEY,
        hostname TEXT NOT NULL,
        env_name TEXT NOT NULL,
        patch_timestamp TIMESTAMPTZ NOT NULL,
        patch_type TEXT,
        snapshot_used TEXT,
        packages_changed INTEGER,
        awx_job_id TEXT,
        operator TEXT,
        status TEXT,
        reboot_done BOOLEAN DEFAULT false,
        packages_detail JSONB
      );

      CREATE INDEX IF NOT EXISTS idx_patch_hostname
        ON patch_history (hostname, patch_timestamp DESC);

# ── Step 6: Create snapshots table ─────────────────────────────────
- name: Create snapshots table
  community.postgresql.postgresql_query:
    db: "{{ patch_governance_db_name }}"
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    query: |
      CREATE TABLE IF NOT EXISTS snapshots (
        name TEXT PRIMARY KEY,
        created_at TIMESTAMPTZ DEFAULT NOW(),
        mirror_sources TEXT[],
        dev_published_at TIMESTAMPTZ,
        staging_published_at TIMESTAMPTZ,
        prod_published_at TIMESTAMPTZ,
        approved_by TEXT,
        notes TEXT
      );

# ── Step 7: Create reboot_debt view ────────────────────────────────
- name: Create reboot_debt view
  community.postgresql.postgresql_query:
    db: "{{ patch_governance_db_name }}"
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    query: |
      CREATE OR REPLACE VIEW reboot_debt AS
        SELECT
            ph.hostname,
            ph.env_name,
            ph.patch_timestamp AS kernel_patched_at,
            EXTRACT(DAY FROM NOW() - ph.patch_timestamp)::INTEGER AS days_overdue,
            sr.reboot_required
        FROM patch_history ph
        JOIN scan_results sr ON sr.hostname = ph.hostname
        WHERE ph.patch_type = 'kernel'
          AND ph.reboot_done = false
          AND sr.reboot_required = true
          AND sr.scan_timestamp = (
              SELECT MAX(scan_timestamp)
              FROM scan_results
              WHERE hostname = ph.hostname
          );

# ── Step 8: Create read-only Grafana user ──────────────────────────
- name: Create patchgov_ro read-only user
  community.postgresql.postgresql_user:
    name: "{{ patch_governance_db_ro_user }}"
    password: "{{ patch_governance_db_ro_password }}"
    db: "{{ patch_governance_db_name }}"
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    state: present
  ignore_errors: true

- name: Grant CONNECT on patchgov to patchgov_ro
  community.postgresql.postgresql_privs:
    database: "{{ patch_governance_db_name }}"
    roles: "{{ patch_governance_db_ro_user }}"
    type: database
    privs: CONNECT
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    state: present

- name: Grant SELECT on all tables to patchgov_ro
  community.postgresql.postgresql_privs:
    database: "{{ patch_governance_db_name }}"
    roles: "{{ patch_governance_db_ro_user }}"
    type: table
    objs: ALL_IN_SCHEMA
    schema: public
    privs: SELECT
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    state: present

# ── Step 9: Data retention cleanup ─────────────────────────────────
- name: Prune old scan_results ({{ scan_results_retention_days }} day retention)
  community.postgresql.postgresql_query:
    db: "{{ patch_governance_db_name }}"
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    query: >
      DELETE FROM scan_results
      WHERE scan_timestamp < NOW() - make_interval(days => {{ scan_results_retention_days }})
  register: pruned_scans

- name: Report pruned scan_results
  ansible.builtin.debug:
    msg: "Pruned {{ pruned_scans.rowcount }} old scan_results rows"

# ── Step 10: Schema verification ───────────────────────────────────
- name: Verify schema objects
  community.postgresql.postgresql_query:
    db: "{{ patch_governance_db_name }}"
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    query: |
      SELECT
        table_name,
        table_type
      FROM information_schema.tables
      WHERE table_schema = 'public'
      ORDER BY table_type, table_name;
  register: schema_objects

- name: Print schema objects
  ansible.builtin.debug:
    msg: "{{ schema_objects.query_result }}"

- name: Governance database setup complete
  ansible.builtin.debug:
    msg:
      - "Database: {{ patch_governance_db_name }}"
      - "Tables: scan_results, scan_package_details, patch_history, snapshots"
      - "Views: reboot_debt"
      - "Read-only user: {{ patch_governance_db_ro_user }}"
      - "Retention: {{ scan_results_retention_days }} days (scan_results)"

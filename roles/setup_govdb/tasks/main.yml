---
# setup_govdb — One-time provisioning of the patchgov PostgreSQL governance database
# Creates 4 tables, 1 view, 9 indexes, read-only user, and performs retention cleanup.
# Fully idempotent — safe to re-run.

- name: Check PostgreSQL connectivity
  community.postgresql.postgresql_ping:
    db: "{{ patch_governance_db_name }}"
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
  register: pg_ping
  ignore_errors: true

- name: Fail if PostgreSQL is unreachable
  ansible.builtin.fail:
    msg: >
      Cannot connect to PostgreSQL at {{ patch_governance_db_host }}:{{ patch_governance_db_port }}.
      Ensure the govdb container is running and healthy.
  when: pg_ping is failed

# ── Step 1: Connection pool tuning ─────────────────────────────────
# Note: ALTER SYSTEM SET max_connections = {{ patch_governance_db_max_connections }};
# requires a PostgreSQL restart and cannot run in a transaction block.
# For lab environments, the default 100 connections is sufficient.
# For production, run manually: ALTER SYSTEM SET max_connections = 200;
- name: Log connection pool info
  ansible.builtin.debug:
    msg: "Current max_connections: 100 (lab default). Production override: ALTER SYSTEM SET max_connections = 200;"

# ── Step 2: Create database ────────────────────────────────────────
- name: Create patchgov database
  community.postgresql.postgresql_db:
    name: "{{ patch_governance_db_name }}"
    state: present
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"

# ── Step 3: Create scan_results table ──────────────────────────────
- name: Create scan_results table
  community.postgresql.postgresql_query:
    db: "{{ patch_governance_db_name }}"
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    query: "{{ lookup('file', 'sql/001_create_scan_results.sql') }}"

# ── Step 4: Create scan_package_details table ──────────────────────
- name: Create scan_package_details table
  community.postgresql.postgresql_query:
    db: "{{ patch_governance_db_name }}"
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    query: "{{ lookup('file', 'sql/002_create_scan_package_details.sql') }}"

# ── Step 5: Create patch_history table ─────────────────────────────
- name: Create patch_history table
  community.postgresql.postgresql_query:
    db: "{{ patch_governance_db_name }}"
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    query: "{{ lookup('file', 'sql/003_create_patch_history.sql') }}"

# ── Step 6: Create snapshots table ─────────────────────────────────
- name: Create snapshots table
  community.postgresql.postgresql_query:
    db: "{{ patch_governance_db_name }}"
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    query: "{{ lookup('file', 'sql/004_create_snapshots.sql') }}"

# ── Step 7: Create reboot_debt view ────────────────────────────────
- name: Create reboot_debt view
  community.postgresql.postgresql_query:
    db: "{{ patch_governance_db_name }}"
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    query: "{{ lookup('file', 'sql/005_create_reboot_debt_view.sql') }}"

# ── Step 8: Create read-only Grafana user ──────────────────────────
- name: Create patchgov_ro read-only user
  community.postgresql.postgresql_user:
    name: "{{ patch_governance_db_ro_user }}"
    password: "{{ patch_governance_db_ro_password }}"
    db: "{{ patch_governance_db_name }}"
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    state: present
  ignore_errors: true

- name: Grant CONNECT on patchgov to patchgov_ro
  community.postgresql.postgresql_privs:
    database: "{{ patch_governance_db_name }}"
    roles: "{{ patch_governance_db_ro_user }}"
    type: database
    privs: CONNECT
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    state: present

- name: Grant SELECT on all tables to patchgov_ro
  community.postgresql.postgresql_privs:
    database: "{{ patch_governance_db_name }}"
    roles: "{{ patch_governance_db_ro_user }}"
    type: table
    objs: ALL_IN_SCHEMA
    schema: public
    privs: SELECT
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    state: present

# ── Step 9: Data retention cleanup ─────────────────────────────────
- name: Prune old scan_results ({{ scan_results_retention_days }} day retention)
  community.postgresql.postgresql_query:
    db: "{{ patch_governance_db_name }}"
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    query: >
      DELETE FROM scan_results
      WHERE scan_timestamp < NOW() - make_interval(days => {{ scan_results_retention_days }})
  register: pruned_scans

- name: Report pruned scan_results
  ansible.builtin.debug:
    msg: "Pruned {{ pruned_scans.rowcount }} old scan_results rows"

# ── Step 10: Schema verification ───────────────────────────────────
- name: Verify schema objects
  community.postgresql.postgresql_query:
    db: "{{ patch_governance_db_name }}"
    login_host: "{{ patch_governance_db_host }}"
    login_port: "{{ patch_governance_db_port }}"
    login_user: "{{ patch_governance_db_user }}"
    login_password: "{{ patch_governance_db_password }}"
    query: "{{ lookup('file', 'sql/006_verify_schema.sql') }}"
  register: schema_objects

- name: Print schema objects
  ansible.builtin.debug:
    msg: "{{ schema_objects.query_result }}"

- name: Governance database setup complete
  ansible.builtin.debug:
    msg:
      - "Database: {{ patch_governance_db_name }}"
      - "Tables: scan_results, scan_package_details, patch_history, snapshots"
      - "Views: reboot_debt"
      - "Read-only user: {{ patch_governance_db_ro_user }}"
      - "Retention: {{ scan_results_retention_days }} days (scan_results)"

# PatchOps Lab Stack — Aptly Mirror + Ubuntu Servers
# Usage: docker compose -f compose.lab.yml up -d
# No Dockerfiles — Ansible playbook handles all setup.
# Each service boots ubuntu:24.04 with SSH + Python3 only.

services:
  aptly:
    image: ubuntu:24.04
    container_name: patchops-aptly
    hostname: patchops-aptly
    command: >
      sh -c "apt-get update -qq &&
      apt-get install -y -qq openssh-server python3 sudo > /dev/null 2>&1 &&
      mkdir -p /run/sshd /home/aptly/.ssh &&
      useradd -u 115 -m -s /bin/bash aptly 2>/dev/null || true &&
      echo 'aptly:aptly' | chpasswd &&
      echo 'aptly ALL=(ALL:ALL) NOPASSWD:ALL' > /etc/sudoers.d/aptly &&
      cat /tmp/ssh_key.pub > /home/aptly/.ssh/authorized_keys &&
      chmod 600 /home/aptly/.ssh/authorized_keys &&
      chown -R aptly:aptly /home/aptly/.ssh &&
      exec /usr/sbin/sshd -D"
    ports:
      - "80:80"
      - "8080:8080"
      - "2200:22"
    volumes:
      - aptly-data:/var/cache/aptly
      - aptly-gnupg:/home/aptly/.gnupg
      - ${HOME}/.ssh/personal.pub:/tmp/ssh_key.pub:ro
    networks:
      - ansible-lab-net

  ubuntu1:
    image: ubuntu:24.04
    container_name: ansible-ubuntu1
    hostname: ansible-ubuntu1
    command: >
      sh -c "apt-get update -qq &&
      apt-get install -y -qq openssh-server python3 sudo > /dev/null 2>&1 &&
      mkdir -p /run/sshd /home/ansible/.ssh &&
      useradd -m -s /bin/bash ansible 2>/dev/null || true &&
      echo 'ansible:ansible' | chpasswd &&
      echo 'ansible ALL=(ALL:ALL) NOPASSWD:ALL' > /etc/sudoers.d/ansible &&
      cat /tmp/ssh_key.pub > /home/ansible/.ssh/authorized_keys &&
      chmod 600 /home/ansible/.ssh/authorized_keys &&
      chown -R ansible:ansible /home/ansible/.ssh &&
      exec /usr/sbin/sshd -D"
    ports:
      - "2201:22"
    volumes:
      - ubuntu1-home:/home/ansible
      - ubuntu1-data:/data
      - ${HOME}/.ssh/personal.pub:/tmp/ssh_key.pub:ro
    networks:
      - ansible-lab-net

  ubuntu2:

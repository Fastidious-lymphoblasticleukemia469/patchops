---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: yamllint .

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible + collections
        run: |
          pip install ansible-core ansible-lint
          ansible-galaxy collection install community.general community.postgresql
      - name: Run ansible-lint
        run: ansible-lint

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible + collections
        run: |
          pip install ansible-core
          ansible-galaxy collection install community.general community.postgresql
      - name: Create dummy vault password (syntax-check never decrypts secrets)
        run: echo -n "ci-placeholder" > .vault_pass
      - name: Syntax-check all playbooks
        run: |
          set -e
          for pb in playbooks/*.yml; do
            echo "=== $pb ==="
            if [ "$(basename "$pb")" = "rollback.yml" ]; then
              # rollback.yml's second play uses `hosts: "{{ env }}"` — requires env at parse time
              ansible-playbook "$pb" --syntax-check -e "env=dev snapshot=placeholder"
            else
              ansible-playbook "$pb" --syntax-check
            fi
          done

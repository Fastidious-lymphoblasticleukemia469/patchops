version: 3

images:
  base_image:
    name: registry.fedoraproject.org/fedora:42

dependencies:
  python_interpreter:
    package_system: python3

  ansible_core:
    package_pip: ansible-core==2.17.14

  ansible_runner:
    package_pip: ansible-runner==2.3.7

  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt
